<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b83b5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Our Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf5f3;--ink:#2a1f26;--mute:#8a7780;--rose:#b83b5e;--card:#fff;--line:#ecdfe2;--them:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1418;--ink:#f3e8ec;--mute:#a48f98;--card:#271c22;--line:#3a2b33;--them:#2c2026}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Inter','Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.screen{display:none;height:100dvh;flex-direction:column}.screen.on{display:flex}
input,button,textarea{font:inherit}
.center{justify-content:center;align-items:center;padding:24px;text-align:center}
.center h1{margin:0 0 4px;font-size:28px;font-weight:600}.center p{margin:0 0 20px;color:var(--mute)}
.f{width:100%;max-width:340px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:12px}
.btn{width:100%;max-width:340px;padding:14px;border:0;border-radius:12px;background:var(--rose);color:#fff;font-weight:600}
#err,#perr{color:#c0392b;min-height:22px;margin-top:8px;font-size:14px}
#pin{letter-spacing:14px;text-align:center;font-size:26px;max-width:220px}
header{background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.top b{font-size:18px;font-weight:600}.top span button{background:none;border:0;font-size:18px;padding:4px 8px;color:var(--mute)}
.tabs{display:flex}.tabs button{flex:1;padding:10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--rose);border-color:var(--rose)}
.pane{display:none;flex:1;overflow-y:auto}.pane.on{display:flex}
#msgs{flex-direction:column;gap:4px;padding:12px}
.day{align-self:center;color:var(--mute);font-size:12px;margin:10px 0 4px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--them);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.45;position:relative}
.m.me{align-self:flex-end;background:var(--rose);color:#fff;border-color:var(--rose);border-bottom-right-radius:4px}
.m:not(.me){align-self:flex-start;border-bottom-left-radius:4px}
.m a{color:inherit;text-decoration:underline}
.m img{display:block;max-width:100%;max-height:320px;border-radius:10px;min-height:60px;background:rgba(0,0,0,.08)}
.t{display:block;font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.q{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;opacity:.75;font-size:13px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.rx i{font-style:normal;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.tk{margin-left:4px;letter-spacing:-2px}.tk.sn{color:#7fd6ff;font-weight:600}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.i.big{width:44px;height:44px;margin-bottom:10px;color:var(--rose)}
.top span button{display:inline-flex;align-items:center}.top span .i{width:22px;height:22px}#rep button{display:flex}
.empty{margin:auto;color:var(--mute);text-align:center}
#bar{background:var(--card);border-top:1px solid var(--line);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#rep{display:none;justify-content:space-between;align-items:center;padding:4px 10px;margin-bottom:6px;border-left:3px solid var(--rose);background:var(--bg);font-size:13px;color:var(--mute)}
#rep button{background:none;border:0;color:var(--mute);font-size:16px}
.row{display:flex;gap:8px;align-items:flex-end}
#txt{flex:1;min-width:0;min-height:44px;resize:none;max-height:122px;margin:0;padding:10px 16px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);font-size:16px;line-height:22px;outline:none;display:block}#txt:focus{border-color:var(--rose)}
.ic{width:44px;height:44px;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--rose);color:#fff;flex:none;cursor:pointer}#send .i{transform:translate(-1px,1px)}
.ic.alt{background:var(--bg);color:var(--rose);border:1px solid var(--line)}.ic:disabled{opacity:.5}
#grid{flex-wrap:wrap;align-content:flex-start;gap:3px;padding:3px}
#grid .gh{width:100%;padding:10px 8px 2px;color:var(--mute);font-size:13px}
#grid img{width:calc(33.33% - 2px);aspect-ratio:1;object-fit:cover;background:var(--line)}
.ov{position:fixed;inset:0;z-index:20;display:none}.ov.on{display:flex}
#lb{background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:82%}#lb button,#lb a{color:#fff;background:none;border:0;padding:14px;font-size:15px;text-decoration:none}
#sh{background:rgba(0,0,0,.4);align-items:flex-end}
#shc{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#emo{display:flex;justify-content:space-around;margin-bottom:8px}#emo button{font-size:26px;background:none;border:0;padding:6px}
#acts button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 6px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font-size:16px}
#acts .dl{color:#c0392b}
</style>
</head>
<body>
<section id="login" class="screen center on" style="display:none">
  <h1>Our Chat</h1><p>Private chat, just for the two of us</p>
  <input id="em" class="f" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" class="f" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go" class="btn">Sign in</button><div id="err"></div>
</section>

<section id="lock" class="screen center">
  <svg class="i big" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><h1>Enter PIN</h1><p>Enter your 4-digit PIN to open the app</p>
  <input id="pin" class="f" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div id="perr"></div>
</section>

<section id="chat" class="screen">
  <header>
    <div class="top"><b>Our Chat</b><span><button id="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button><button id="setpin" aria-label="PIN lock"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button><button id="out" aria-label="Sign out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></span></div>
    <div class="tabs"><button id="t1" class="on">Chat</button><button id="t2">Gallery</button></div>
  </header>
  <div id="msgs" class="pane on"></div>
  <div id="grid" class="pane"></div>
  <div id="bar">
    <div id="rep"><span id="rept"></span><button id="repx" aria-label="Cancel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button></div>
    <div class="row">
      <button id="pick" class="ic alt" aria-label="Photo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <input id="file" type="file" accept="image/*" hidden>
      <textarea id="txt" rows="1" placeholder="Type a message"></textarea>
      <button id="send" class="ic" aria-label="Send"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
</section>

<div id="lb" class="ov"><img id="lbi" alt=""><div><a id="lbd" download="photo.jpg">Save</a><button id="lbx">Close</button></div></div>
<div id="sh" class="ov"><div id="shc"><div id="emo"></div><div id="acts"></div></div></div>

<script>
const sb=supabase.createClient('https://ockrtfffgqttdrglvdwe.supabase.co','sb_publishable_ngtroLtSH5NnwP5HB_5pag__PJkKLht');
const $=id=>document.getElementById(id),EMO=['❤️','😂','😮','😢','👍'];
let me=null,chan=null,lastDay='',reply=null,hiddenAt=0,gridDone=false;
const cache=new Map(),shown=new Set(),rx=new Map(),urls=new Map(),rc=new Map();

function show(id){document.querySelectorAll('.screen').forEach(s=>{s.classList.toggle('on',s.id===id);s.style.display=''})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const near=()=>{const e=$('msgs');return e.scrollHeight-e.scrollTop-e.clientHeight<120};
const down=()=>{const e=$('msgs');e.scrollTop=e.scrollHeight};
async function sign(p){if(urls.has(p))return urls.get(p);const {data}=await sb.storage.from('photos').createSignedUrl(p,3600);if(data)urls.set(p,data.signedUrl);return data&&data.signedUrl}
const snip=m=>m?(m.body?m.body.slice(0,60):'Photo'):'Deleted message';

/* ---------- PIN lock ---------- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('our-chat:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockNow(){if(!localStorage.getItem('pinh'))return false;$('pin').value='';$('perr').textContent='';show('lock');return true}
$('pin').oninput=async e=>{
  if(e.target.value.length<4)return;
  if(await sha(e.target.value)===localStorage.getItem('pinh')){show('chat');setTimeout(down,50);markSoon()}
  else{$('perr').textContent='Incorrect PIN';e.target.value=''}
};
$('setpin').onclick=async()=>{
  const p=prompt('Enter a new 4-digit PIN. Leave it empty and press OK to turn the PIN off.');
  if(p===null)return;
  if(p===''){localStorage.removeItem('pinh');alert('PIN turned off');return}
  if(!/^\d{4}$/.test(p)){alert('Enter exactly 4 digits');return}
  localStorage.setItem('pinh',await sha(p));alert('PIN turned on');
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(!me)return;
  if(Date.now()-hiddenAt>30000)lockNow();
  load();
});

/* ---------- render ---------- */
function paintRx(id){
  const el=document.querySelector(`.m[data-id="${id}"] .rx`);if(!el)return;
  const c={};Object.values(rx.get(id)||{}).forEach(e=>c[e]=(c[e]||0)+1);
  el.innerHTML=Object.entries(c).map(([e,n])=>`<i>${e}${n>1?' '+n:''}</i>`).join('');
}
function render(m){
  if(shown.has(m.id))return;shown.add(m.id);cache.set(m.id,m);
  const box=$('msgs'),stick=near(),d=new Date(m.created_at),emp=box.querySelector('.empty');if(emp)emp.remove();
  if(d.toDateString()!==lastDay){lastDay=d.toDateString();const x=document.createElement('div');x.className='day';x.textContent=d.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});box.appendChild(x)}
  const el=document.createElement('div');el.className='m'+(m.sender_id===me?' me':'');el.dataset.id=m.id;
  if(m.reply_to){const q=document.createElement('div');q.className='q';q.textContent=snip(cache.get(m.reply_to));el.appendChild(q)}
  if(m.image_path){const i=document.createElement('img');i.alt='Photo';el.appendChild(i);
    sign(m.image_path).then(u=>{if(u){i.src=u;i.onload=()=>{if(stick)down()}}});i.dataset.p=m.image_path}
  if(m.body){const s=document.createElement('span');s.innerHTML=linkify(m.body);el.appendChild(s)}
  const t=document.createElement('span');t.className='t';t.textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});if(m.sender_id===me){const k=document.createElement('span');k.className='tk';t.appendChild(k)}el.appendChild(t);
  const r=document.createElement('div');r.className='rx';el.appendChild(r);
  box.appendChild(el);paintRx(m.id);paintTick(m.id);if(m.sender_id!==me)markSoon();
  if(stick||m.sender_id===me)down();
}

async function load(){
  const [a,b,c]=await Promise.all([
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(200),
    sb.from('reactions').select('*'),sb.from('receipts').select('*')]);
  if(a.error){console.error(a.error);return}
  (c.data||[]).forEach(r=>rc.set(r.message_id,r));
  (b.data||[]).forEach(r=>{const o=rx.get(r.message_id)||{};o[r.user_id]=r.emoji;rx.set(r.message_id,o)});
  a.data.reverse().forEach(render);
  rx.forEach((_,id)=>paintRx(id));
  if(!shown.size)$('msgs').innerHTML='<div class="empty">No messages yet.<br>Send the first one.</div>';
  down();
}

function listen(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('live')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{render(p.new);gridDone=false})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{
      const el=document.querySelector(`.m[data-id="${p.old.id}"]`);if(el)el.remove();cache.delete(p.old.id);shown.delete(p.old.id);gridDone=false})
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},p=>{
      if(p.eventType==='DELETE'){const o=rx.get(p.old.message_id);if(o){delete o[p.old.user_id];paintRx(p.old.message_id)}}
      else{const r=p.new,o=rx.get(r.message_id)||{};o[r.user_id]=r.emoji;rx.set(r.message_id,o);paintRx(r.message_id)}})
   .on('postgres_changes',{event:'*',schema:'public',table:'receipts'},p=>{if(p.eventType!=='DELETE'){rc.set(p.new.message_id,p.new);paintTick(p.new.message_id)}})
   .subscribe();
}

async function start(u){me=u.id;shown.clear();cache.clear();rx.clear();rc.clear();lastDay='';$('msgs').innerHTML='';
  if(!lockNow())show('chat');await load();listen()}

/* ---------- delivered / seen ---------- */
function paintTick(id){
  const el=document.querySelector(`.m.me[data-id="${id}"] .tk`);if(!el)return;
  const r=rc.get(id)||{};el.textContent=(r.delivered_at||r.seen_at)?'✓✓':'✓';el.classList.toggle('sn',!!r.seen_at);
}
let mt=null;const markSoon=()=>{clearTimeout(mt);mt=setTimeout(markRead,400)};
async function markRead(){
  if(!me)return;
  const seeing=!document.hidden&&$('chat').classList.contains('on')&&$('msgs').classList.contains('on');
  const others=[...cache.values()].filter(m=>m.sender_id!==me),now=new Date().toISOString();
  const del=others.filter(m=>!rc.get(m.id)).map(m=>({message_id:m.id,delivered_at:now}));
  if(del.length){const {error}=await sb.from('receipts').upsert(del);if(!error)del.forEach(r=>rc.set(r.message_id,r))}
  if(!seeing)return;
  const sn=others.filter(m=>!(rc.get(m.id)||{}).seen_at).map(m=>({message_id:m.id,delivered_at:(rc.get(m.id)||{}).delivered_at||now,seen_at:now}));
  if(sn.length){const {error}=await sb.from('receipts').upsert(sn);if(!error)sn.forEach(r=>rc.set(r.message_id,r))}
}

/* ---------- actions ---------- */
let target=null;
$('msgs').onclick=e=>{
  const el=e.target.closest('.m');if(!el||e.target.closest('a'))return;
  const i=e.target.closest('img');if(i&&i.src){openLb(i.src);return}
  target=cache.get(+el.dataset.id);if(!target)return;
  $('emo').innerHTML=EMO.map(x=>`<button data-e="${x}">${x}</button>`).join('');
  const own=target.sender_id===me;
  $('acts').innerHTML=`<button data-a="rep"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg> Reply</button>${target.body?'<button data-a="cp"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>':''}${own?'<button class="dl" data-a="del"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Delete</button>':''}`;
  $('sh').classList.add('on');
};
$('sh').onclick=async e=>{
  if(e.target.id==='sh'){$('sh').classList.remove('on');return}
  const b=e.target.closest('button');if(!b||!target)return;$('sh').classList.remove('on');
  if(b.dataset.e){
    const mine=(rx.get(target.id)||{})[me];
    if(mine===b.dataset.e)await sb.from('reactions').delete().eq('message_id',target.id).eq('user_id',me);
    else await sb.from('reactions').upsert({message_id:target.id,user_id:me,emoji:b.dataset.e});
  }else if(b.dataset.a==='rep'){reply=target.id;$('rept').textContent='Replying to: '+snip(target);$('rep').style.display='flex';$('txt').focus()}
  else if(b.dataset.a==='cp')navigator.clipboard&&navigator.clipboard.writeText(target.body);
  else if(b.dataset.a==='del'&&confirm('This message will be deleted for everyone. Delete it?')){
    const {error}=await sb.from('messages').delete().eq('id',target.id);
    if(error)alert('Could not delete the message.');else if(target.image_path)sb.storage.from('photos').remove([target.image_path]);
  }
};
const clearRep=()=>{reply=null;$('rep').style.display='none'};
$('repx').onclick=clearRep;

async function sendText(){
  const body=$('txt').value.trim();if(!body)return;
  $('txt').value='';$('txt').style.height='auto';const rt=reply;clearRep();
  const {error}=await sb.from('messages').insert({body,reply_to:rt});
  if(error){$('txt').value=body;alert('Message not sent. Check your connection and try again.')}
}
function compress(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);
  i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.75)};i.onerror=no;i.src=u})}
async function sendPhoto(f){
  if(!f)return;$('pick').disabled=true;
  try{const b=await compress(f),p=`${me}/${Date.now()}.jpg`,rt=reply;clearRep();
    const u=await sb.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;
    const {error}=await sb.from('messages').insert({image_path:p,reply_to:rt});if(error)throw error}
  catch(e){console.error(e);alert('Could not send the photo. Please try again.')}
  $('pick').disabled=false;$('file').value='';
}

/* ---------- gallery ---------- */
function openLb(u){$('lbi').src=u;$('lbd').href=u;$('lb').classList.add('on')}
$('lbx').onclick=()=>$('lb').classList.remove('on');
async function buildGrid(){
  const g=$('grid'),ph=[...cache.values()].filter(m=>m.image_path).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  g.innerHTML='';if(!ph.length){g.innerHTML='<div class="empty" style="width:100%;padding:40px">No photos yet.</div>';gridDone=true;return}
  let mo='';
  for(const m of ph){
    const l=new Date(m.created_at).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(l!==mo){mo=l;const h=document.createElement('div');h.className='gh';h.textContent=l;g.appendChild(h)}
    const i=document.createElement('img');i.loading='lazy';i.alt='Photo';g.appendChild(i);
    sign(m.image_path).then(u=>{if(u){i.src=u;i.onclick=()=>openLb(u)}});
  }
  gridDone=true;
}
function tab(n){
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
  $('msgs').classList.toggle('on',n===1);$('grid').classList.toggle('on',n===2);
  $('bar').style.display=n===1?'':'none';
  if(n===2&&!gridDone)buildGrid();else if(n===1){down();markSoon()}
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* ---------- login ---------- */
async function login(){
  $('err').textContent='';$('go').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  $('go').disabled=false;
  if(error){$('err').textContent='Incorrect email or password.';return}
  start(data.user);
}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('send').onclick=sendText;$('pick').onclick=()=>$('file').click();$('file').onchange=e=>sendPhoto(e.target.files[0]);
$('txt').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight+2,122)+'px'};
$('out').onclick=async()=>{if(!confirm('Sign out?'))return;await sb.auth.signOut();if(chan)sb.removeChannel(chan);me=null;show('login')};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)start(session.user);else show('login')})();
const VAPID='BEbPi_wfjiT4vHOalWkwbJTVSFh2oRKHR-P6YAWaZhjolCQeJ5V6ZEv5oi-9FpX6BsY0snbxxPg_BGYNk08NkeI';
const u8=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
$('bell').onclick=async()=>{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('Notifications are not supported in this browser. Please use Chrome.');return}
  if(await Notification.requestPermission()!=='granted'){alert('Notification permission was not granted.');return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const {error}=await sb.from('push_subs').upsert({user_id:me,endpoint:sub.endpoint,sub:sub.toJSON()});
    if(error)throw error;alert('Notifications turned on');
  }catch(e){console.error(e);alert('Could not turn on notifications.\n\nReason: '+((e&&(e.name?e.name+': ':'')+(e.message||e.details||''))||e))}
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
