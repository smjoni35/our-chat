.center h1,#splash b,#inbox .ttl b{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:-.01em}
.center h1{font-size:42px;margin-bottom:6px}#splash b{font-size:36px;letter-spacing:0}#inbox .ttl b{font-size:26px}
#splash .logo{animation:pop .6s cubic-bezier(.2,.8,.2,1)}
.f{padding:15px 16px;border-radius:14px}.f:focus{outline:0;border-color:var(--rose);box-shadow:0 0 0 4px color-mix(in srgb,var(--rose) 18%,transparent)}
.btn{padding:15px;border-radius:14px;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--rose) 70%,transparent)}
header{background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);position:relative;z-index:4}
.tabs{margin:2px 14px 10px;padding:3px;gap:2px;background:var(--bg);border-radius:14px}
.tabs button,.tabs button.on{border:0;border-radius:11px;padding:8px;font-size:14px}
.tabs button.on{background:var(--card);color:var(--rose);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.m{border-radius:20px;padding:9px 14px;font-size:15.5px;line-height:1.5;border-color:transparent;box-shadow:0 1px 1px rgba(43,31,38,.05),0 8px 18px -12px rgba(43,31,38,.35)}
html[data-theme=dark] .m:not(.me){border-color:var(--line)}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .m:not(.me){border-color:var(--line)}}
.m.me{background:linear-gradient(160deg,color-mix(in srgb,var(--rose) 92%,#fff),color-mix(in srgb,var(--rose) 78%,#000));border-color:transparent}
.m.jb{box-shadow:none}.t{font-size:10.5px;opacity:.65}
.day{background:color-mix(in srgb,var(--mute) 13%,transparent);border:0;padding:3px 12px;border-radius:12px}
#bar{background:transparent;border:0;padding:4px 10px calc(10px + var(--safe))}
.row{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:5px;gap:2px;box-shadow:0 10px 26px -14px rgba(43,31,38,.4)}
.ic.alt{background:none;border:0;width:38px;height:38px;color:var(--mute)}.ic.alt:hover{color:var(--rose);filter:none}
#txt{background:none;border:0;padding:9px 6px;min-height:40px;border-radius:0}#txt:focus{border:0;box-shadow:none}
#send{width:40px;height:40px;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--rose) 80%,transparent)}
.row:has(#txt:placeholder-shown) #send{display:none}.row:has(#txt:not(:placeholder-shown)) #mic{display:none}
@media (pointer:coarse){#emj,#ep{display:none!important}}
.ir{padding:12px 16px;gap:14px}.ir.act{background:color-mix(in srgb,var(--rose) 9%,transparent)}.ir:hover{background:color-mix(in srgb,var(--rose) 6%,transparent)}
.av{box-shadow:0 4px 12px -6px color-mix(in srgb,var(--rose) 70%,transparent)}
#shc,#stc,#psc{border-radius:26px 26px 0 0;padding:10px 16px calc(16px + var(--safe))}
#shc::before,#stc::before,#psc::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (min-width:900px){#shc::before,#stc::before,#psc::before{display:none}#shc,#stc,#psc{border-radius:22px}}
.stt,#plans h3{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);font-weight:600}
#acts button,#stl button,#pl button{padding:14px 6px}
.card{border-radius:18px;box-shadow:0 8px 20px -16px rgba(43,31,38,.5)}
.cnt{font-family:var(--serif);font-size:28px;font-weight:600;font-style:italic}.cnt small{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;font-style:normal}
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe));transform:translate(-50%,12px);max-width:min(90vw,420px);padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
#toast.on{opacity:1;transform:translate(-50%,0)}
#offl{position:fixed;top:0;left:0;right:0;z-index:95;display:none;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;text-align:center;font-size:13px;background:#c0392b;color:#fff}#offl.on{display:block}
.lnk{background:none;border:0;color:var(--rose);margin-top:14px;font-weight:600;cursor:pointer;padding:6px}#nm{display:none}
#reqs{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}.rqh{padding:12px 16px 4px;font-weight:600;font-size:15px}
.rq{display:flex;align-items:center;gap:12px;padding:8px 16px}.rq .pbtn{padding:8px 14px;font-size:14px;cursor:pointer}
#reqb{display:none;padding:8px 16px;font-size:13px;color:var(--mute);text-align:center;background:color-mix(in srgb,var(--rose) 8%,transparent)}
/* call screens */
#call,#inc{background:#120d12;color:#fff}
#rv{position:absolute;inset:0;background:#120d12}
#lv{top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:104px;height:144px;border-radius:16px;border:0;box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:2}
#cpeer{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.cav{--s:132px;box-shadow:0 0 0 0 color-mix(in srgb,var(--rose) 50%,transparent);animation:cring 1.8s ease-out infinite}
@keyframes cring{to{box-shadow:0 0 0 40px transparent}}
#call.live .cav{animation:none}
@media (prefers-reduced-motion:reduce){.cav{animation:none}}
#cnm,#incn{display:block;font-size:28px;font-weight:600;margin-top:22px;color:#fff}
#cst,#inct{position:static;display:block;margin-top:6px;font-size:16px;color:rgba(255,255,255,.7);text-shadow:none;font-variant-numeric:tabular-nums}
#inc br{display:none}
#call.vl #cpeer{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;align-items:flex-start;text-align:left;padding:0 130px 0 20px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#call.vl .cav{display:none}#call.vl #cnm{margin-top:0;font-size:20px}#call.vl #cst{color:#fff}
#cbar,#ibar{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:28px;z-index:3}
#ibar{gap:72px}
#cbar button,#ibar button{width:auto;height:auto;background:none;border-radius:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:500}
#cbar button i,#ibar button i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .15s,color .15s}
#cbar button.off i{background:#fff;color:#120d12}
#cbar #cend i,#ibar #ino i{background:#e5484d}#ibar #iok i{background:#30a46c}
#cbar #cend,#ibar #ino,#ibar #iok{background:none}
.ci{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ci .sl{display:none}.off .ci .sl{display:inline}.rot{transform:rotate(135deg)}
</style>
</head>

<path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Save chat as text</button><button id="out" class="dl"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Sign out</button></div></div></div>

<script>
const sb=supabase.createClient('https://ockrtfffgqttdrglvdwe.supabase.co','sb_publishable_ngtroLtSH5NnwP5HB_5pag__PJkKLht');
const $=id=>document.getElementById(id),EMO=['❤️','😂','😮','😢','👍'];
let me=null,chan=null,lastDay='',reply=null,hiddenAt=0,gridDone=false;
const cache=new Map(),shown=new Set(),rx=new Map(),urls=new Map(),rc=new Map();
const pins=new Map();let pinIdx=0;
const convs=new Map(),profiles=new Map();let curConv=null;
let editing=null,lastEl=null,swiped=false,sw=null,room=null,typT=0,tmo=null,peerOn=false;

const desk=()=>matchMedia('(min-width:900px)').matches;
function show(id){
  const app=id==='chat'||id==='inbox';document.body.classList.toggle('app',app&&desk());
  document.querySelectorAll('.screen').forEach(s=>{s.classList.toggle('on',s.id===id||(app&&desk()&&(s.id==='chat'||s.id==='inbox')));s.style.display=''})
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const near=()=>{const e=$('msgs');return e.scrollHeight-e.scrollTop-e.clientHeight<120};
const down=()=>{const e=$('msgs');e.scrollTop=e.scrollHeight};
async function sign(p){if(urls.has(p))return urls.get(p);const {data}=await sb.storage.from('photos').createSignedUrl(p,3600);if(data)urls.set(p,data.signedUrl);return data&&data.signedUrl}
const timeStr=m=>new Date(m.created_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+(m.edited_at?' · edited':'');
const snip=m=>m?(m.body?m.body.slice(0,60):(m.audio_path?'Voice message':m.file_path?'📎 '+(m.file_name||'File'):'Photo')):'Deleted message';

/* ---------- PIN lock ---------- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('our-chat:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockNow(){if(!localStorage.getItem('pinh'))return false;$('pin').value='';$('perr').textContent='';show('lock');return true}
$('pin').oninput=async e=>{
  if(e.target.value.length<4)return;
  if(await sha(e.target.value)===localStorage.getItem('pinh'))openApp()
  else{$('perr').textContent='Incorrect PIN';e.target.value=''}
};
$('setpin').onclick=async()=>{
  const p=prompt('Enter a new 4-digit PIN. Leave it empty and press OK to turn the PIN off.');
  if(p===null)return;
  if(p===''){localStorage.removeItem('pinh');alert('PIN turned off');return}
  if(!/^\d{4}$/.test(p)){alert('Enter exactly 4 digits');return}
  localStorage.setItem('pinh',await sha(p));alert('PIN turned on');
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(room)room.untrack();return}
  if(!me)return;
  if(room)room.track({at:Date.now()});
  const lm=+(localStorage.getItem('lockms')||30000);if(lm>=0&&Date.now()-hiddenAt>=lm)lockNow();
  load();
});

/* ---------- render ---------- */
function paintRx(id){
  const el=document.querySelector(`.m[data-id="${id}"] .rx`);if(!el)return;
  const c={};Object.values(rx.get(id)||{}).forEach(e=>c[e]=(c[e]||0)+1);
  el.innerHTML=Object.entries(c).map(([e,n])=>`<i>${e}${n>1?' '+n:''}</i>`).join('');
}
function render(m,anim){
  cache.set(m.id,m);if(m.conversation_id&&m.conversation_id!==curConv){inboxDirty();return}if(shown.has(m.id))return;shown.add(m.id);

   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{

}

/* ---------- voice messages ---------- */
async function micToggle(){
  if(rec){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){alert('Voice messages are not supported in this browser.');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Microphone permission is needed to record.');return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  rec=new MediaRecorder(st,mt?{mimeType:mt}:{});recChunks=[];recCancel=false;recStart=Date.now();
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=async()=>{
    clearInterval(recT);st.getTracks().forEach(t=>t.stop());
    const type=(rec&&rec.mimeType)||mt||'audio/webm';rec=null;
    $('recbar').classList.remove('on');$('mic').classList.remove('hot');
    if(recCancel||Date.now()-recStart<700)return;
    const ext=type.includes('mp4')?'m4a':'webm',path=me+'/'+Date.now()+'.'+ext;
    const up=await sb.storage.from('photos').upload(path,new Blob(recChunks,{type}),{contentType:type.split(';')[0]});
    if(up.error){alert('Could not send the voice message.');return}
    const rt=reply;clearRep();
    const {error}=await sb.from('messages').insert({audio_path:path,reply_to:rt,conversation_id:curConv});
    if(error)alert('Could not send the voice message.');
  };
  rec.start();$('recbar').classList.add('on');$('mic').classList.add('hot');
  recT=setInterval(()=>{const sec=Math.floor((Date.now()-recStart)/1000);$('rect').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec>=180&&rec)rec.stop()},500);
}

/* ---------- voice & video calls (1-to-1, WebRTC) ---------- */
let pc=null,lstream=null,cch=null,cstate=null,pend=[],uch=null,cmch=null,inv=null,ring=0,ringT=0;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function sendTo(uid,event,payload){return new Promise(res=>{const ch=sb.channel('u:'+uid);ch.subscribe(st=>{if(st==='SUBSCRIBED'){ch.send({type:'broadcast',event,payload}).then(()=>{setTimeout(()=>sb.removeChannel(ch),600);res()})}})})}
async function media(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false})}catch(e){alert('Microphone/camera permission is needed for calls.');return null}}
function callUi(on,t){$('call').classList.toggle('on',on);if(t)$('cst').textContent=t}
function mkPc(){
  pc=new RTCPeerConnection(ICE);pend=[];
  lstream.getTracks().forEach(t=>pc.addTrack(t,lstream));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0]};
  pc.onicecandidate=e=>{if(e.candidate&&cch)cch.send({type:'broadcast',event:'ice',payload:e.candidate.toJSON()})};
  pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected'){clearTimeout(ringT);callUi(true,'Connected')}else if(pc.connectionState==='failed')endCall(true)};
}
async function flushIce(){for(const c of pend.splice(0))try{await pc.addIceCandidate(c)}catch(_){}}
function joinCall(conv,onReady){
  cch=sb.channel('call:'+conv);
  cch.on('broadcast',{event:'ready'},async()=>{if(!pc)return;const o=await pc.createOffer();await pc.setLocalDescription(o);cch.send({type:'broadcast',event:'offer',payload:o})})
   .on('broadcast',{event:'offer'},async({payload})=>{if(!pc)return;await pc.setRemoteDescription(payload);await flushIce();const a=await pc.createAnswer();await pc.setLocalDescription(a);cch.send({type:'broadcast',event:'answer',payload:a})})
   .on('broadcast',{event:'answer'},async({payload})=>{if(!pc)return;await pc.setRemoteDescription(payload);await flushIce()})
   .on('broadcast',{event:'ice'},async({payload})=>{if(pc&&pc.remoteDescription){try{await pc.addIceCandidate(payload)}catch(_){}}else pend.push(payload)})
   .on('broadcast',{event:'bye'},()=>endCall(false))
   .subscribe(st=>{if(st==='SUBSCRIBED'&&onReady)onReady()});
}
async function startCall(video){
  const c=convs.get(curConv);if(!c||c.is_group||pc||!window.RTCPeerConnection)return;

  callUi(true,'Calling '+c.name+'…');mkPc();joinCall(curConv);
  sendTo(peer,'invite',{conv:curConv,from:me,name:(profiles.get(me)||{}).name||'Someone',video});
  ringT=setTimeout(()=>{if(cstate&&pc&&pc.connectionState!=='connected'){endCall(true);alert('No answer.')}},45000);
}
function onInvite(p){
  if(!me||!p)return;
  if(pc||inv){sendTo(p.from,'decline',{});return}
  inv=p;$('incn').textContent=p.name||'Someone';$('inct').textContent=p.video?'is video calling…':'is calling…';$('inc').classList.add('on');
  clearInterval(ring);beep();ring=setInterval(beep,1600);setTimeout(()=>{if(inv===p)dismissInvite()},45000);
}
function dismissInvite(){clearInterval(ring);inv=null;$('inc').classList.remove('on')}
$('iok').onclick=async()=>{

  cstate={conv:p.conv,peer:p.from,video:p.video};$('lv').srcObject=lstream;$('lv').style.display=p.video?'':'none';$('ccam').style.display=p.video?'':'none';
  callUi(true,'Connecting…');mkPc();joinCall(p.conv,()=>cch.send({type:'broadcast',event:'ready',payload:{}}));
};
$('ino').onclick=()=>{if(inv)sendTo(inv.from,'decline',{});dismissInvite()};
function endCall(notify){
  if(!cstate&&!pc)return;const st=cstate;cstate=null;clearTimeout(ringT);
  if(notify&&st){if(cch)cch.send({type:'broadcast',event:'bye',payload:{}});sendTo(st.peer,'cancel',{})}
  if(pc){pc.onconnectionstatechange=null;pc.close();pc=null}
  if(lstream){lstream.getTracks().forEach(t=>t.stop());lstream=null}

$('ccam').onclick=()=>{if(!lstream)return;const t=lstream.getVideoTracks();t.forEach(x=>x.enabled=!x.enabled);$('ccam').textContent=t[0]&&t[0].enabled?'📷':'🚫'};
$('vcall').onclick=()=>startCall(false);$('xcall').onclick=()=>startCall(true);

const u8=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};

const b64=a=>btoa(String.fromCharCode(...a)),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function kdf(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256)))}
async function setPinHash(p){const s=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem('pins',b64(s));localStorage.setItem('pinh',await kdf(p,s))}
$('pin').oninput=async e=>{
  const v=e.target.value;if(v.length<4)return;
  const w=+localStorage.getItem('pinu')||0;if(Date.now()<w){e.target.value='';$('perr').textContent='Too many tries. Wait '+Math.ceil((w-Date.now())/1000)+'s.';return}
  const h=localStorage.getItem('pinh'),s=localStorage.getItem('pins');
  if((s?await kdf(v,ub(s)):await sha(v))===h){localStorage.removeItem('pinf');localStorage.removeItem('pinu');if(!s)await setPinHash(v);openApp();return}
  const f=(+localStorage.getItem('pinf')||0)+1;localStorage.setItem('pinf',f);e.target.value='';
  if(f%5===0){localStorage.setItem('pinu',Date.now()+Math.min(30*2**(f/5-1),900)*1000);$('perr').textContent='Too many tries. Try again in a moment.'}else $('perr').textContent='Incorrect PIN';
};
