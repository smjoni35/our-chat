<style>
:root{--bg:#fbf5f3;--ink:#2a1f26;--mute:#8a7780;--rose:#b83b5e;--card:#fff;--line:#ecdfe2;--them:#fff}

.row{display:flex;gap:8px;align-items:flex-end}

.ic{width:44px;height:44px;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--rose);color:#fff;flex:none;cursor:pointer}#send .i{transform:translate(-1px,1px)}

</style>

<script>
const sb=supabase.createClient('https://ockrtfffgqttdrglvdwe.supabase.co','sb_publishable_ngtroLtSH5NnwP5HB_5pag__PJkKLht');
const $=id=>document.getElementById(id),EMO=['❤️','😂','😮','😢','👍'];
let me=null,chan=null,lastDay='',reply=null,hiddenAt=0,gridDone=false;
const cache=new Map(),shown=new Set(),rx=new Map(),urls=new Map(),rc=new Map();
const pins=new Map();let pinIdx=0;
let editing=null,lastEl=null,swiped=false,sw=null,room=null,typT=0,tmo=null,peerOn=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>{s.classList.toggle('on',s.id===id);s.style.display=''})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const near=()=>{const e=$('msgs');return e.scrollHeight-e.scrollTop-e.clientHeight<120};
const down=()=>{const e=$('msgs');e.scrollTop=e.scrollHeight};
async function sign(p){if(urls.has(p))return urls.get(p);const {data}=await sb.storage.from('photos').createSignedUrl(p,3600);if(data)urls.set(p,data.signedUrl);return data&&data.signedUrl}
const timeStr=m=>new Date(m.created_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+(m.edited_at?' · edited':'');
const snip=m=>m?(m.body?m.body.slice(0,60):(m.audio_path?'Voice message':'Photo')):'Deleted message';

/* ---------- PIN lock ---------- */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('our-chat:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockNow(){if(!localStorage.getItem('pinh'))return false;$('pin').value='';$('perr').textContent='';show('lock');return true}
$('pin').oninput=async e=>{
  if(e.target.value.length<4)return;
  if(await sha(e.target.value)===localStorage.getItem('pinh')){show('chat');setTimeout(down,50);markSoon()}
  else{$('perr').textContent='Incorrect PIN';e.target.value=''}
};
$('setpin').onclick=async()=>{
  const p=prompt('Enter a new 4-digit PIN. Leave it empty and press OK to turn the PIN off.');
  if(p===null)return;
  if(p===''){localStorage.removeItem('pinh');alert('PIN turned off');return}
  if(!/^\d{4}$/.test(p)){alert('Enter exactly 4 digits');return}
  localStorage.setItem('pinh',await sha(p));alert('PIN turned on');
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();if(room)room.untrack();return}
  if(!me)return;
  if(room)room.track({at:Date.now()});
  const lm=+(localStorage.getItem('lockms')||30000);if(lm>=0&&Date.now()-hiddenAt>=lm)lockNow();
  load();
});

/* ---------- render ---------- */
function paintRx(id){
  const el=document.querySelector(`.m[data-id="${id}"] .rx`);if(!el)return;
  const c={};Object.values(rx.get(id)||{}).forEach(e=>c[e]=(c[e]||0)+1);
  el.innerHTML=Object.entries(c).map(([e,n])=>`<i>${e}${n>1?' '+n:''}</i>`).join('');
}
function render(m,anim){
  if(shown.has(m.id))return;shown.add(m.id);cache.set(m.id,m);
  const box=$('msgs'),stick=near(),d=new Date(m.created_at),emp=box.querySelector('.empty');if(emp)emp.remove();
  if(d.toDateString()!==lastDay){lastDay=d.toDateString();const x=document.createElement('div');x.className='day';x.textContent=d.toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});box.appendChild(x)}

async function load(){
  const [a,b,c,pn]=await Promise.all([
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('reactions').select('*'),sb.from('receipts').select('*'),sb.from('pins').select('*')]);

  pins.clear();(pn.data||[]).forEach(r=>pins.set(r.message_id,r));
  (b.data||[]).forEach(r=>{const o=rx.get(r.message_id)||{};o[r.user_id]=r.emoji;rx.set(r.message_id,o)});
  a.data.reverse().forEach(render);paintPins();

function listen(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('live')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{render(p.new,true);gridDone=false})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{
      const el=document.querySelector(`.m[data-id="${p.old.id}"]`);if(el)el.remove();cache.delete(p.old.id);shown.delete(p.old.id);gridDone=false})
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},p=>{
      if(p.eventType==='DELETE'){const o=rx.get(p.old.message_id);if(o){delete o[p.old.user_id];paintRx(p.old.message_id)}}
      else{const r=p.new,o=rx.get(r.message_id)||{};o[r.user_id]=r.emoji;rx.set(r.message_id,o);paintRx(r.message_id)}})
   .on('postgres_changes',{event:'*',schema:'public',table:'receipts'},p=>{if(p.eventType!=='DELETE'){rc.set(p.new.message_id,p.new);paintTick(p.new.message_id)}})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{
      const m=p.new;cache.set(m.id,{...(cache.get(m.id)||{}),...m});
      const el=document.querySelector(`.m[data-id="${m.id}"]`);if(!el)return;
      const vb2=el.querySelector('.vob');if(vb2)vo(cache.get(m.id),vb2);
      const bd=el.querySelector('.bd');if(bd)bd.innerHTML=linkify(m.body||'');
      const t=el.querySelector('.t');if(t&&t.firstChild)t.firstChild.nodeValue=timeStr(m)})
   .on('postgres_changes',{event:'*',schema:'public',table:'pins'},p=>{if(p.eventType==='DELETE')pins.delete(p.old.message_id);else pins.set(p.new.message_id,p.new);paintPins()})
   .on('postgres_changes',{event:'*',schema:'public',table:'events'},plansDirty)
   .on('postgres_changes',{event:'*',schema:'public',table:'notes'},plansDirty)
   .subscribe();
}

function compress(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);

    c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.75)};i.onerror=no;i.src=u})}

  else if(b.id==='eva'){const t=$('evt').value.trim(),d=$('evd').value;if(!t||!d){alert('Enter an occasion and a date.');return}
    const {error}=await sb.from('events').insert({title:t,event_date:d});if(error)alert('Could not save.');loadPlans()}
  else if(b.id==='nta'){const l=$('nl').value.trim()||'General',t=$('nt').value.trim();if(!t)return;
    const {error}=await sb.from('notes').insert({list:l,text:t});if(error)alert('Could not save.');loadPlans()}
  else if(b.id==='sma'){const t=$('sm').value.trim(),v=$('sd').value;if(!t||!v){alert('Enter a message and a date and time.');return}
    const at=new Date(v);if(at<=new Date()){alert('Pick a time in the future.');return}
    const {error}=await sb.from('scheduled').insert({body:t,send_at:at.toISOString()});if(error)alert('Could not schedule.');loadPlans()}
};

/* ---------- view once ---------- */
function vo(m,b){const mine=m.sender_id===me;b.disabled=!!m.viewed_at||mine;b.innerHTML=EYE+' '+(m.viewed_at?'Photo · opened':mine?'Photo · not opened yet':'Tap to view photo (once)')}
async function openOnce(id){
  const m=cache.get(id);if(!m||m.sender_id===me||m.viewed_at)return;
  const {data,error}=await sb.storage.from('photos').createSignedUrl(m.image_path,300);
  if(error||!data){alert('This photo is no longer available.');return}
  onceId=id;$('lbd').style.display='none';$('lbi').src=data.signedUrl;$('lb').classList.add('on');
}
async function closeLb(){
  $('lb').classList.remove('on');$('lbd').style.display='';
  if(onceId){const id=onceId,m=cache.get(id);onceId=null;$('lbi').src='';
    await sb.rpc('mark_viewed',{mid:id});if(m)await sb.storage.from('photos').remove([m.image_path])}
}
$('ps').onclick=e=>{
  const b=e.target.closest('button'),f=pendingFile;
  if(e.target.id!=='ps'&&!b)return;
  $('ps').classList.remove('on');pendingFile=null;
  if(b&&f)sendPhoto(f,b.dataset.m==='o');else $('file').value='';
};

/* ---------- voice messages ---------- */
async function micToggle(){
  if(rec){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){alert('Voice messages are not supported in this browser.');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Microphone permission is needed to record.');return}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  rec=new MediaRecorder(st,mt?{mimeType:mt}:{});recChunks=[];recCancel=false;recStart=Date.now();
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=async()=>{
    clearInterval(recT);st.getTracks().forEach(t=>t.stop());
    const type=(rec&&rec.mimeType)||mt||'audio/webm';rec=null;
    $('recbar').classList.remove('on');$('mic').classList.remove('hot');
    if(recCancel||Date.now()-recStart<700)return;
    const ext=type.includes('mp4')?'m4a':'webm',path=me+'/'+Date.now()+'.'+ext;
    const up=await sb.storage.from('photos').upload(path,new Blob(recChunks,{type}),{contentType:type.split(';')[0]});
    if(up.error){alert('Could not send the voice message.');return}
    const rt=reply;clearRep();
    const {error}=await sb.from('messages').insert({audio_path:path,reply_to:rt});
    if(error)alert('Could not send the voice message.');
  };
  rec.start();$('recbar').classList.add('on');$('mic').classList.add('hot');
  recT=setInterval(()=>{const sec=Math.floor((Date.now()-recStart)/1000);$('rect').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec>=180&&rec)rec.stop()},500);
}
$('mic').onclick=micToggle;
$('recx').onclick=()=>{recCancel=true;if(rec)rec.stop()};

/* ---------- login ---------- */
async function login(){
  $('err').textContent='';$('go').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  $('go').disabled=false;
  if(error){$('err').textContent='Incorrect email or password.';return}
  start(data.user);
}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('send').onclick=sendText;$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{pendingFile=e.target.files[0];if(pendingFile)$('ps').classList.add('on')};
$('txt').oninput=e=>{typingPing();e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight+2,122)+'px'};
$('out').onclick=async()=>{if(!confirm('Sign out?'))return;await sb.auth.signOut();if(chan)sb.removeChannel(chan);if(room)sb.removeChannel(room);me=null;show('login')};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)start(session.user);else show('login')})();

const u8=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
$('bell').onclick=async()=>{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('Notifications are not supported in this browser. Please use Chrome.');return}
  if(await Notification.requestPermission()!=='granted'){alert('Notification permission was not granted.');return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const {error}=await sb.from('push_subs').upsert({user_id:me,endpoint:sub.endpoint,sub:sub.toJSON()});
    if(error)throw error;alert('Notifications turned on');
  }catch(e){console.error(e);alert('Could not turn on notifications.\n\nReason: '+((e&&(e.name?e.name+': ':'')+(e.message||e.details||''))||e))}
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
